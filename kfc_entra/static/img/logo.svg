<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="KFC bucket">
  <!-- Three fried chicken pieces overflowing the bucket. Stylised blobs with
       a few crease lines to suggest fried-coating texture. -->
  <g stroke="#1a1a1a" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round" fill="#d68a35">
    <!-- Left piece -->
    <path d="M11 21 Q9 13 17 9 Q26 8 27 16 Q27 22 22 22 Z"/>
    <!-- Centre piece (tallest) -->
    <path d="M22 22 Q21 6 33 4 Q44 4 43 14 Q43 22 38 22 Z"/>
    <!-- Right piece -->
    <path d="M39 22 Q37 10 47 9 Q55 10 54 17 Q54 22 49 22 Z"/>
  </g>
  <!-- Crease lines on the chicken pieces. -->
  <g fill="none" stroke="#1a1a1a" stroke-width="0.7" stroke-linecap="round" opacity="0.7">
    <path d="M16 13 Q18 15 17 18"/>
    <path d="M22 13 Q23 16 22 19"/>
    <path d="M30 9 Q31 13 30 17"/>
    <path d="M37 8 Q38 12 37 17"/>
    <path d="M44 13 Q45 16 44 19"/>
    <path d="M49 13 Q50 16 49 19"/>
  </g>

  <!-- Bucket body: trapezoidal, slightly wider at top, off-white background. -->
  <path d="M10 23 L54 23 L51 58 Q50.5 60 48 60 L16 60 Q13.5 60 13 58 Z"
        fill="#fbf6ea" stroke="#1a1a1a" stroke-width="1.4" stroke-linejoin="round"/>

  <!-- Red vertical side panels - the classic stripe pattern. -->
  <path d="M14 24 L24 24 L23 57 Q23 58 22 58 L15 58 Q14 58 14 57 Z" fill="#e4002b"/>
  <path d="M40 24 L50 24 L50 57 Q50 58 49 58 L42 58 Q41 58 41 57 Z" fill="#e4002b"/>

  <!-- Bottom rim line to suggest the curved base of the bucket. -->
  <path d="M13 58 Q32 62 51 58" fill="none" stroke="#1a1a1a" stroke-width="1.2"/>

  <!-- KFC wordmark on the white front panel. -->
  <text x="32" y="48"
        text-anchor="middle"
        font-family="'Arial Black', 'Trebuchet MS', sans-serif"
        font-weight="900"
        font-size="11"
        fill="#1a1a1a"
        letter-spacing="0.5">KFC</text>
</svg>
