<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="KFC bucket">
  <!-- Bucket body: trapezoid, wider at the top like a chicken bucket. -->
  <path d="M10 17 L54 17 L50 57 Q49.5 60 47 60 L17 60 Q14.5 60 14 57 Z"
        fill="#e4002b"/>
  <!-- Subtle highlight up the left side to give the body some shape. -->
  <path d="M14 19 L18 19 L21 58 L17 58 Z"
        fill="#ffffff" opacity="0.12"/>
  <!-- Rolled paper rim at the top: white ellipse with a darker red edge. -->
  <ellipse cx="32" cy="17" rx="22" ry="3.5" fill="#ffffff"/>
  <ellipse cx="32" cy="17" rx="22" ry="3.5" fill="none" stroke="#b80022" stroke-width="1"/>
  <!-- White oval badge centred on the front, like the storefront roundel. -->
  <ellipse cx="32" cy="37" rx="16" ry="11" fill="#ffffff"/>
  <!-- KFC wordmark in the badge. -->
  <text x="32" y="41"
        text-anchor="middle"
        font-family="'Trebuchet MS', 'Arial Black', sans-serif"
        font-weight="900"
        font-size="13"
        fill="#e4002b"
        letter-spacing="0.5">KFC</text>
</svg>
